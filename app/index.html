<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Rat Race</title>
<meta name="description" content="Map your job hunt: companies, roles, applications, resumes, contacts and interviews, all connected.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-10 -10 20 20'%3E%3Cpath d='M0,-9L7.8,-4.5L7.8,4.5L0,9L-7.8,4.5L-7.8,-4.5Z' fill='%233646C4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Patrick+Hand&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
</head>
<body>
<section id="auth" class="auth" hidden>
  <div class="auth-card">
    <svg class="auth-art" viewBox="-120 -70 240 140" aria-hidden="true">
      <g class="links-art">
        <line x1="-60" y1="-10" x2="-15" y2="-40"/><line x1="-60" y1="-10" x2="-20" y2="25"/><line x1="-15" y1="-40" x2="25" y2="-42"/>
        <line x1="-20" y1="25" x2="20" y2="30"/><line x1="-60" y1="-10" x2="-95" y2="25"/><line x1="60" y1="5" x2="25" y2="-42"/><line x1="60" y1="5" x2="95" y2="-25"/>
      </g>
      <circle class="ring ring-reach i1" cx="-60" cy="-10" r="30"/><circle class="ring ring-reach i0" cx="-60" cy="-10" r="24"/>
      <g class="t-companies" transform="translate(-60,-10)"><path class="shape" d="M0,-18L15.6,-9L15.6,9L0,18L-15.6,9L-15.6,-9Z"/></g>
      <g class="t-companies" transform="translate(60,5)"><path class="shape" d="M0,-15L13,-7.5L13,7.5L0,15L-13,7.5L-13,-7.5Z"/></g>
      <g class="t-roles" transform="translate(-15,-40)"><path class="shape" d="M-7,-7H7V7H-7Z"/></g>
      <g class="s-interviewing" transform="translate(25,-42)"><circle class="shape" r="8"/></g>
      <circle class="ring ring-ref" cx="-20" cy="25" r="11"/>
      <g class="s-applied" transform="translate(-20,25)"><circle class="shape" r="8"/></g>
      <g class="t-people" transform="translate(-95,25)"><path class="shape" d="M0,-8L7.6,5.8L-7.6,5.8Z"/></g>
      <g class="t-interviews" transform="translate(20,30)"><path class="shape" d="M0,-8L8,0L0,8L-8,0Z"/></g>
      <g class="s-rejected" transform="translate(95,-25)"><circle class="shape" r="8"/><path class="mark" d="M-4.4,-4.4L4.4,4.4M4.4,-4.4L-4.4,4.4"/></g>
    </svg>
    <h1>The Rat Race</h1>
    <p class="auth-lede">See your whole job hunt as one map: every company, role, application, resume, recruiter and interview, and how they connect.</p>
    <form id="authForm" class="auth-form">
      <label for="authEmail">Email</label>
      <div class="auth-row">
        <input id="authEmail" type="email" required autocomplete="email" placeholder="you@example.com">
        <button id="authSubmit" class="btn primary" type="submit">Email me a sign-in link</button>
      </div>
      <button id="googleBtn" class="btn" type="button" hidden>Continue with Google</button>
    </form>
    <p id="authMsg" class="auth-msg" role="status"></p>
    <p class="auth-fine">Your map is private to your account. No password needed.</p>
  </div>
</section>
<div id="app" hidden>
  <header class="top">
    <div class="brand"><h1>The Rat Race</h1><span class="sub">job hunt map</span></div>
    <nav class="tabs" role="tablist" aria-label="Views">
      <button role="tab" data-view="graph" aria-selected="true" id="tab-graph">Map</button>
      <button role="tab" data-view="pipeline" aria-selected="false" id="tab-pipeline">Pipeline</button>
      <button role="tab" data-view="timeline" aria-selected="false" id="tab-timeline">Timeline</button>
    </nav>
    <div class="tools">
      <input id="search" type="search" placeholder="Search companies, people, notes" aria-label="Search">
      <button id="clearSample" class="btn small" hidden>Clear sample data</button>
      <button id="addBtn" class="btn primary" aria-haspopup="true" aria-expanded="false">+ Add</button>
      <div id="addMenu" class="menu" hidden></div>
      <button id="acctBtn" class="btn acct" aria-haspopup="true" aria-expanded="false" aria-label="Account"><span id="acctEmail">Account</span></button>
      <div id="acctMenu" class="menu" hidden>
        <button type="button" id="exportBtn">Export my data (JSON)</button>
        <button type="button" id="importBtn">Import from JSON…</button>
        <button type="button" id="signOutBtn">Sign out</button>
      </div>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </div>
  </header>
  <section class="stats" id="stats" aria-label="Summary"></section>
  <div id="banner" class="banner" hidden></div>
  <main class="main">
    <section id="view-graph" class="view">
      <svg id="graph" aria-label="Map of companies, roles, applications and contacts"></svg>
      <div class="graph-ctl"><div id="typeChips" class="chips"></div><div id="statusChips" class="chips"></div></div>
      <div class="graph-btns"><button id="tidyBtn" class="btn small" title="Let every node float back into a tidy layout">Tidy</button><button id="fitBtn" class="btn small" title="Zoom to show everything">Fit</button></div>
      <div class="legend" id="legend" aria-label="Legend"></div>
      <div class="hint">drag to move (it stays put) · double-click to release · scroll to zoom</div>
      <div id="empty" class="empty" hidden></div>
    </section>
    <section id="view-pipeline" class="view" hidden><div id="board" class="board"></div></section>
    <section id="view-timeline" class="view" hidden><div id="timeline" class="tl"></div></section>
    <aside id="panel" class="panel" hidden aria-label="Details"></aside>
  </main>
  <div id="toast" class="toast" hidden role="status"></div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
