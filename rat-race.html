<title>The Rat Race</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen app shell. Header + stats strip on top, the active view fills the rest, a detail panel slides over the right edge (bottom sheet on phones). */
:root {
  --bg: #F2F3F7; --surface: #FFFFFF; --surface-2: #E8EAF1; --ink: #161A2E; --ink-2: #3A4060; --muted: #5E647C;
  --line: #D6DAE4; --line-strong: #B9BFCE; --accent: #3646C4; --accent-ink: #FFFFFF; --focus: #3646C4;
  --c-company: #3646C4; --c-doc: #9A6B2F; --c-person: #B4307A; --c-interview: #6D46D9; --c-event: #8A90A6;
  --s-wishlist: #A4AABD; --s-applied: #2F7FD6; --s-screen: #12949F; --s-interviewing: #DD8618;
  --s-offer: #2B9A56; --s-rejected: #D0433D; --s-ghosted: #8E93A6; --s-withdrawn: #BFC3D0;
  --warn-bg: #FFF4E0; --warn-ink: #7A4A00; --referral: #C08F00;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 8px; --shadow: 0 10px 30px rgba(22, 26, 46, .14);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1220; --surface: #181C2C; --surface-2: #232839; --ink: #E7E9F2; --ink-2: #C3C7D8; --muted: #989EB6;
  --line: #2C3247; --line-strong: #434A63; --accent: #8E9AFF; --accent-ink: #0F1220; --focus: #8E9AFF;
  --c-company: #8E9AFF; --c-doc: #CFA36B; --c-person: #F07AB8; --c-interview: #A98DFF; --c-event: #737A93;
  --s-wishlist: #7C8299; --s-applied: #62A4F4; --s-screen: #37C2CC; --s-interviewing: #F4A442;
  --s-offer: #4CC47A; --s-rejected: #F0675F; --s-ghosted: #6F758B; --s-withdrawn: #4F5569;
  --warn-bg: #3A2C12; --warn-ink: #F6CF8A; --referral: #F2C94C; --shadow: 0 10px 30px rgba(0, 0, 0, .45); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0F1220; --surface: #181C2C; --surface-2: #232839; --ink: #E7E9F2; --ink-2: #C3C7D8; --muted: #989EB6;
  --line: #2C3247; --line-strong: #434A63; --accent: #8E9AFF; --accent-ink: #0F1220; --focus: #8E9AFF;
  --c-company: #8E9AFF; --c-doc: #CFA36B; --c-person: #F07AB8; --c-interview: #A98DFF; --c-event: #737A93;
  --s-wishlist: #7C8299; --s-applied: #62A4F4; --s-screen: #37C2CC; --s-interviewing: #F4A442;
  --s-offer: #4CC47A; --s-rejected: #F0675F; --s-ghosted: #6F758B; --s-withdrawn: #4F5569;
  --warn-bg: #3A2C12; --warn-ink: #F6CF8A; --referral: #F2C94C; --shadow: 0 10px 30px rgba(0, 0, 0, .45); color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--f-body); }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

#app { height: 100%; display: flex; flex-direction: column; gap: 10px; padding-inline: 16px; padding-block: 12px; min-width: 0; }

/* Header */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand h1 { font: 700 24px/1 var(--f-display); letter-spacing: -.02em; margin: 0; }
.brand .sub { font: 500 11px var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.tabs { display: flex; background: var(--surface-2); border-radius: 999px; padding: 3px; }
.tabs button { border: 0; background: none; padding: 6px 14px; border-radius: 999px; cursor: pointer; color: var(--muted); font-weight: 500; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.tools { display: flex; gap: 8px; align-items: center; position: relative; flex-wrap: wrap; }
#search { width: 220px; max-width: 100%; padding: 7px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 13px; border-radius: 999px; cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--line-strong); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.small { padding: 4px 10px; font-size: 12.5px; }
.btn.danger { color: var(--s-rejected); }
.btn.danger.solid { background: var(--s-rejected); color: #fff; border-color: var(--s-rejected); }
.btn[disabled] { opacity: .45; cursor: default; }
.menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 6px; min-width: 200px; display: grid; }
.menu button { display: flex; align-items: center; gap: 10px; border: 0; background: none; text-align: left; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
.menu button:hover, .menu button:focus-visible { background: var(--surface-2); }

/* Stats strip */
.stats { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 26px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.stat { display: grid; gap: 1px; }
.stat b { font: 700 20px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.stat span { font: 500 10.5px var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
.funnel { flex: 1 1 240px; min-width: 0; display: grid; gap: 5px; }
.funnel-bar { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--surface-2); }
.funnel-bar i { display: block; height: 100%; }
.funnel-legend { display: flex; flex-wrap: wrap; gap: 2px 12px; font: 11px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.funnel-legend em { font-style: normal; display: inline-flex; align-items: center; gap: 5px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.best { font-size: 12.5px; color: var(--muted); max-width: 30ch; }
.best strong { color: var(--ink); font-weight: 600; }

.banner { padding: 10px 14px; border-radius: var(--r); background: var(--warn-bg); color: var(--warn-ink); }

/* Main area */
.main { position: relative; flex: 1; min-height: 240px; min-width: 0; }
.view { position: absolute; inset: 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }

/* Graph */
#graph { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab;
  background-image: radial-gradient(var(--line) 1px, transparent 1px); background-size: 22px 22px; }
#graph:active { cursor: grabbing; }
.link { stroke: var(--line-strong); stroke-width: 1.2; transition: opacity .15s; }
.link.k-applications-resumeId, .link.k-applications-letterId { stroke-dasharray: 3 3; }
.link.k-events-refs { stroke-dasharray: 1 3; }
.node { cursor: pointer; transition: opacity .15s; }
.shape { stroke: var(--surface); stroke-width: 1.5; }
.t-companies .shape { fill: var(--c-company); }
.t-roles .shape { fill: var(--surface); stroke: var(--c-company); stroke-width: 2.2; }
.t-documents .shape { fill: var(--surface); stroke: var(--c-doc); stroke-width: 2.2; }
.t-people .shape { fill: var(--c-person); }
.t-interviews .shape { fill: var(--c-interview); }
.t-events .shape { fill: var(--c-event); }
.s-wishlist .shape { fill: var(--s-wishlist); } .s-applied .shape { fill: var(--s-applied); }
.s-screen .shape { fill: var(--s-screen); } .s-interviewing .shape { fill: var(--s-interviewing); }
.s-offer .shape { fill: var(--s-offer); } .s-rejected .shape { fill: var(--s-rejected); }
.s-withdrawn .shape { fill: var(--s-withdrawn); }
.s-ghosted .shape { fill: var(--surface); stroke: var(--s-ghosted); stroke-width: 2; stroke-dasharray: 2.5 2; }
.label { font: 500 11px var(--f-body); fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-width: 3.5px; stroke-linejoin: round; pointer-events: none; text-anchor: middle; opacity: 0; transition: opacity .15s; }
.t-companies .label { opacity: 1; font: 700 12.5px var(--f-display); }
#graph.zoomed .label, .node.hl .label, .node.selected .label, .node.match .label { opacity: 1; }
#graph.hovering .node:not(.hl) { opacity: .16; }
#graph.hovering .link:not(.hl) { opacity: .07; }
.link.hl { stroke: var(--ink-2); stroke-width: 1.8; }
.node.selected .shape { stroke: var(--ink); stroke-width: 3; }
#graph.searching .node:not(.match) { opacity: .14; }
#graph.searching .link { opacity: .1; }
/* Outreach halos: one ring per contact reached at a company */
.ring { fill: none; pointer-events: none; }
.ring-reach { stroke: var(--c-company); stroke-width: 1.6; fill: var(--c-company); fill-opacity: .06; }
.ring-reach.i0 { stroke-opacity: .6; } .ring-reach.i1 { stroke-opacity: .4; } .ring-reach.i2 { stroke-opacity: .25; } .ring-reach.i3 { stroke-opacity: .14; }
.hot .ring-reach.last { animation: halo 2.8s ease-in-out infinite; }
@keyframes halo { 0%, 100% { stroke-opacity: .1; fill-opacity: .03; } 50% { stroke-opacity: .5; fill-opacity: .12; } }
.reach { font: 500 10px var(--f-mono); fill: var(--c-company); text-anchor: middle; pointer-events: none; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; }
/* Referral: gold ring + star; gold link to the referrer */
.ring-ref { stroke: var(--referral); stroke-width: 2.2; }
.ring-offer { stroke: var(--s-offer); stroke-width: 5; stroke-opacity: .3; }
.badge-star { fill: var(--referral); stroke: var(--surface); stroke-width: 1; }
.link.referral { stroke: var(--referral); stroke-width: 2.4; stroke-dasharray: none; }
/* Closed applications */
.mark { fill: none; stroke-width: 2; stroke-linecap: round; pointer-events: none; }
.s-rejected .shape { fill: var(--surface); stroke: var(--s-rejected); stroke-width: 2; }
.s-rejected .mark { stroke: var(--s-rejected); }
.s-withdrawn .mark { stroke: var(--muted); }
.node.s-rejected, .node.s-withdrawn { opacity: .7; }
.s-rejected .label, .s-withdrawn .label { text-decoration: line-through; fill: var(--muted); }
.link.dead { stroke-opacity: .35; stroke-dasharray: 2 3; }
.legend { position: absolute; left: 12px; bottom: 28px; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11.5px; color: var(--muted); pointer-events: none; background: color-mix(in srgb, var(--surface) 85%, transparent); padding: 4px 8px; border-radius: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend svg { width: 22px; height: 22px; overflow: visible; }
.tag-ref { color: var(--referral); font-weight: 500; }
.card.closed-card { opacity: .72; }
.card.closed-card .t { text-decoration: line-through; text-decoration-color: var(--s-rejected); }
.card.ref-card { border-color: var(--referral); box-shadow: inset 3px 0 0 var(--referral); }

.graph-ctl { position: absolute; left: 12px; top: 12px; right: 90px; display: grid; gap: 6px; pointer-events: none; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { pointer-events: auto; display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 7px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 12px; color: var(--ink-2); }
.chip .n { font: 11px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="false"] { opacity: .45; background: transparent; }
.chip[aria-pressed="false"] .ico { filter: grayscale(1); }
.ico { width: 14px; height: 14px; flex: none; overflow: visible; }
.graph-btns { position: absolute; right: 12px; top: 12px; display: flex; gap: 6px; }
.hint { position: absolute; left: 12px; bottom: 10px; font: 11px var(--f-mono); color: var(--muted); pointer-events: none; }

.empty { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; pointer-events: none; }
.empty-card { pointer-events: auto; max-width: 400px; text-align: center; display: grid; gap: 10px; justify-items: center; padding: 26px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.empty-card h2 { font: 700 20px var(--f-display); margin: 0; text-wrap: balance; }
.empty-card p { margin: 0; color: var(--muted); }

/* Pipeline */
#view-pipeline { overflow: auto; }
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(220px, 1fr); gap: 10px; padding: 12px; min-height: 100%; }
.col { display: flex; flex-direction: column; gap: 8px; background: var(--bg); border-radius: var(--r); padding: 8px; min-width: 0; border: 2px solid transparent; transition: border-color .12s; }
.col.over { border-color: var(--accent); }
.col.closed { background: transparent; border: 2px dashed var(--line); }
.col-head { display: flex; align-items: center; gap: 7px; font: 700 13.5px var(--f-display); padding: 2px 4px 4px; }
.col-head .count { margin-left: auto; font: 500 11px var(--f-mono); color: var(--muted); }
.cards { display: grid; gap: 7px; align-content: start; flex: 1; }
.card { text-align: left; display: grid; gap: 4px; padding: 9px 10px; border-radius: 7px; background: var(--surface); border: 1px solid var(--line); cursor: grab; }
.card:hover { border-color: var(--line-strong); }
.card.dragging { opacity: .4; }
.card .t { font-weight: 600; line-height: 1.25; }
.card .c { color: var(--muted); font-size: 12.5px; }
.card .meta { display: flex; flex-wrap: wrap; gap: 4px 8px; font: 11px var(--f-mono); color: var(--muted); }
.card .warn { color: var(--s-interviewing); }
.col-empty { font-size: 12px; color: var(--muted); padding: 6px 4px; }

/* Timeline */
#view-timeline { overflow: auto; }
.tl { max-width: 760px; margin: 0 auto; padding: 16px; display: grid; gap: 18px; }
.tl-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tl-bar label { font: 500 11px var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
.tl-bar select { padding: 5px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); }
.tl h3 { font: 700 15px var(--f-display); margin: 0 0 6px; color: var(--ink-2); }
.tl h3 small { font: 500 11px var(--f-mono); color: var(--muted); margin-left: 6px; }
.tl-list { display: grid; border-left: 2px solid var(--line); margin-left: 6px; }
.tl-item { display: grid; grid-template-columns: 76px 1fr; gap: 10px; align-items: start; padding: 7px 8px 7px 0; position: relative; text-align: left; border: 0; background: none; cursor: pointer; border-radius: 6px; }
.tl-item:hover { background: var(--bg); }
.tl-item .ico { position: absolute; left: -8px; top: 10px; background: var(--surface); }
.tl-item time { font: 11.5px var(--f-mono); color: var(--muted); padding-left: 16px; padding-top: 2px; font-variant-numeric: tabular-nums; }
.tl-item .what { min-width: 0; }
.tl-item .what b { font-weight: 600; }
.tl-item .what span { color: var(--muted); font-size: 12.5px; display: block; }
.tl-none { color: var(--muted); }
.upcoming { background: var(--bg); border-radius: var(--r); padding: 12px; }

/* Panel */
.panel { position: absolute; right: 10px; top: 10px; bottom: 10px; width: 380px; max-width: calc(100% - 20px); z-index: 20; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; }
.p-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px 0; }
.badge { display: inline-flex; align-items: center; gap: 6px; font: 500 11px var(--f-mono); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.x { margin-left: auto; border: 0; background: none; font-size: 20px; line-height: 1; cursor: pointer; color: var(--muted); padding: 4px 6px; border-radius: 6px; }
.x:hover { background: var(--surface-2); }
.p-body { overflow: auto; padding: 6px 14px 14px; display: grid; gap: 14px; align-content: start; }
.p-title { font: 700 21px/1.15 var(--f-display); margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.p-sub { color: var(--muted); margin: 2px 0 0; }
.nudge { background: var(--warn-bg); color: var(--warn-ink); padding: 8px 10px; border-radius: 7px; font-size: 13px; }
.pills { display: flex; flex-wrap: wrap; gap: 5px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 12.5px; }
.pill[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field { display: grid; gap: 4px; min-width: 0; grid-column: span 2; }
.field.half { grid-column: span 1; }
.field > label, .sec-label { font: 500 10.5px var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
.field input, .field select, .field textarea { width: 100%; padding: 7px 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); min-width: 0; }
.field textarea { resize: vertical; min-height: 64px; }
.multi { display: grid; gap: 6px; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tag { display: inline-flex; align-items: center; gap: 5px; padding: 3px 4px 3px 9px; border-radius: 999px; background: var(--surface-2); font-size: 12.5px; max-width: 100%; }
.tag span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag button { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 0 5px; border-radius: 999px; }
.file-box { display: grid; gap: 8px; }
.file-box img { border-radius: 6px; border: 1px solid var(--line); max-height: 200px; object-fit: contain; }
.file-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.file-row a { color: var(--accent); overflow-wrap: anywhere; }
.note { font-size: 12.5px; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.links { display: grid; gap: 4px; }
.link-chip { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; border: 0; background: none; cursor: pointer; text-align: left; width: 100%; }
.link-chip:hover { background: var(--surface-2); }
.link-chip .lt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.link-chip .rel { font: 10.5px var(--f-mono); color: var(--muted); white-space: nowrap; }
.p-foot { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); flex-wrap: wrap; align-items: center; }
.p-foot .spacer { flex: 1; }
.perf { font-size: 13px; }
.perf b { font-variant-numeric: tabular-nums; }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50; background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 999px; font-size: 13px; box-shadow: var(--shadow); max-width: calc(100% - 32px); }

@media (max-width: 720px) {
  .brand h1 { font-size: 20px; }
  .brand .sub { display: none; }
  .tools { width: 100%; }
  #search { flex: 1; width: auto; }
  .stats { gap: 8px 18px; padding: 8px 12px; }
  .stat b { font-size: 17px; }
  .best { display: none; }
  .panel { left: 0; right: 0; top: auto; bottom: 0; width: auto; max-width: none; max-height: 78%; border-radius: 14px 14px 0 0; }
  .graph-ctl { right: 60px; }
  .hint { display: none; }
  .legend { bottom: 10px; right: 12px; }
  .form { grid-template-columns: 1fr; }
  .field.half { grid-column: span 2; }
}
</style>

<div id="app">
  <header class="top">
    <div class="brand"><h1>The Rat Race</h1><span class="sub">job hunt map</span></div>
    <nav class="tabs" role="tablist" aria-label="Views">
      <button role="tab" data-view="graph" aria-selected="true" id="tab-graph">Map</button>
      <button role="tab" data-view="pipeline" aria-selected="false" id="tab-pipeline">Pipeline</button>
      <button role="tab" data-view="timeline" aria-selected="false" id="tab-timeline">Timeline</button>
    </nav>
    <div class="tools">
      <input id="search" type="search" placeholder="Search companies, people, notes" aria-label="Search">
      <button id="clearSample" class="btn small" hidden>Clear sample data</button>
      <button id="addBtn" class="btn primary" aria-haspopup="true" aria-expanded="false">+ Add</button>
      <div id="addMenu" class="menu" hidden></div>
    </div>
  </header>
  <section class="stats" id="stats" aria-label="Summary"></section>
  <div id="banner" class="banner" hidden></div>
  <main class="main">
    <section id="view-graph" class="view">
      <svg id="graph" aria-label="Map of companies, roles, applications and contacts"></svg>
      <div class="graph-ctl"><div id="typeChips" class="chips"></div><div id="statusChips" class="chips"></div></div>

const COLS = Object.keys(TYPES);
const DEFAULTS = {

/* ---------- State ---------- */
const state = {
  data: Object.fromEntries(COLS.map(c => [c, new Map()])),
  loaded: new Set(), view: 'graph', selected: null, search: '',
  types: new Set(COLS.filter(c => c !== 'events')), statuses: new Set(STATUSES.map(s => s.k)),
  tlCompany: '', dbState: 'connecting',

let db = null, assets = null, readOnly = false;
let panel = { mode: null };

/* ---------- Helpers ---------- */
function localDate(d = new Date()) { return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
function parseD(iso) { return iso ? new Date(iso.length === 10 ? iso + 'T00:00:00' : iso) : null; }
function daysBetween(a, b) { const x = parseD(a), y = parseD(b); return x && y ? Math.max(0, Math.round((y - x) / 864e5)) : null; }
function daysSince(iso) { const d = parseD(iso); return d ? Math.floor((Date.now() - d) / 864e5) : null; }

}
const get = (col, id) => id ? state.data[col]?.get(id) : undefined;
const getKey = key => { if (!key) return; const [c, id] = key.split('/'); return get(c, id); };
const exists = key => !!getKey(key);
const all = col => [...state.data[col].values()];
const pct = (a, b) => b ? Math.round(100 * a / b) + '%' : '—';

function companyOf(col, r) {
  if (!r) return;
  switch (col) {
    case 'companies': return r;
    case 'roles': case 'people': return get('companies', r.companyId);
    case 'applications': return companyOf('roles', get('roles', r.roleId));
    case 'interviews': return companyOf('applications', get('applications', r.applicationId));

  }
}
function titleOf(col, r) {

const STAR = 'M0,-3.6L1.06,-1.1L3.42,-1.1L1.6,0.45L2.2,2.9L0,1.5L-2.2,2.9L-1.6,0.45L-3.42,-1.1L-1.06,-1.1Z';

function refsOf(col, r) {

/* ---------- Shapes ---------- */
function shapePath(col, r) {

/* ---------- Data layer ---------- */
function handleErr(e) {

  else if (code === 'resource_exhausted') toast('Too many changes at once. Wait a moment and try again.');

async function write(col, id, body) {

}

}

const newId = col => db ? db.collection(col).doc().id : 'local' + Math.random().toString(36).slice(2);

}

    if (c === col && r.id === id) continue;

async function connect() {
  let tries = 0;

  if (!window.claude?.use) { state.dbState = 'none'; render(); return; }
  db = await window.claude.use('db');
  if (!db) { state.dbState = 'none'; render(); return; }
  state.dbState = 'ok';
  COLS.forEach(c => db.collection(c).onSnapshot(snap => {
    const m = new Map(); snap.docs.forEach(d => m.set(d.id, { ...d.data(), id: d.id }));
    state.data[c] = m; state.loaded.add(c); scheduleRender();
  }, e => { console.warn('[rat-race] subscribe', c, e); if (e.code === 'revoked') { state.dbState = 'none'; scheduleRender(); } }));
  window.claude.use('assets').then(a => { assets = a; if (panel.mode) renderPanel(true); }).catch(() => {});
}

/* ---------- Stats ---------- */
function renderStats() {

  const active = apps.filter(a => ['applied', 'screen', 'interviewing'].includes(a.status));

  const offers = apps.filter(a => a.status === 'offer').length;

    stat(upcoming.length, 'Upcoming interviews'), stat(offers, 'Offers'));

  const bar = h('div', { class: 'funnel-bar', role: 'img', 'aria-label': counts.map(s => `${s.l} ${s.n}`).join(', ') || 'No applications yet' },

function updateGraph() {

  const newSig = nodes.map(n => n.key).join('|') + '#' + links.map(l => l.id).join('|');
  const old = new Map(simNodes.map(n => [n.key, n]));
  const merged = nodes.map(n => { const o = old.get(n.key); if (o) { o.rec = n.rec; return o; } return n; });

      const nb = l && byKey.get(l.source === n.key ? l.target : l.source);

  nodeSel.select('g.halo').selectAll('circle').data(n => {

            const ext = (file.name.split('.').pop() || '').toLowerCase();
            const typeMap = { pdf: 'application/pdf', png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', webp: 'image/webp', gif: 'image/gif', txt: 'text/plain', md: 'text/markdown' };
            const type = typeMap[ext];
            if (!type) { toast(ext === 'docx' || ext === 'doc' ? 'Word files can’t be stored here. Export it as a PDF and attach that.' : 'Attach a PDF, image, or text file.'); inp.value = ''; return; }
            const note = h('div', { class: 'note' }, 'Uploading ' + file.name + '…'); ctl.append(note);
            try { const res = await assets.upload(file, { type }); d.fileId = res.id; d.fileName = file.name; d.fileType = res.contentType; markDirty(); toast('File attached. Save to keep it.'); }
            catch (e) { toast(e.code === 'too_large' ? 'That file is over 20 MB. Compress it and try again.' : 'Upload failed. Try again in a moment.'); }
            draw();
          };
          kids.push(inp);
        } else kids.push(h('div', { class: 'note' }, d.fileId ? '' : 'File uploads are available to people who can edit this page.'));
        ctl.replaceChildren(...kids);
      };
      draw(); break;
    }
  }
  return h('div', { class: 'field' + (f.half ? ' half' : '') }, h('label', { for: id }, f.label + (f.req ? ' *' : '')), ctl);
}

function renderPanel(force) {
  const el = $('#panel');
  if (!panel.mode) { el.hidden = true; return; }
  const { col, id } = panel;
  if (panel.mode === 'edit') {
    const rec = get(col, id);
    if (!rec) { if (state.loaded.has(col)) closePanel(); return; }
    if (!force && panel.dirty) return;
    if (!force) panel.draft = structuredClone(rec);
  } else if (!force) return;
  const scroll = el.querySelector('.p-body')?.scrollTop || 0;
  const T = TYPES[col], d = panel.draft, isNew = panel.mode === 'new';
  const body = h('div', { class: 'p-body' });
  body.append(h('div', null, h('h2', { class: 'p-title' }, isNew ? 'New ' + T.label.toLowerCase() : optLabel(col, d)), !isNew && subOf(col, d) ? h('p', { class: 'p-sub' }, subOf(col, d)) : null));

  if (!isNew && col === 'applications') {
    const days = daysSince(d.statusAt || d.applied);
    if (d.status === 'applied' && days >= 14) body.append(h('div', { class: 'nudge' }, `No reply in ${days} days. Send a follow-up, or move it to Ghosted.`));
    const ref = referralOf(d);
    if (ref) body.append(h('div', { class: 'perf tag-ref' }, '★ Referral' + (ref.name ? ' from ' + ref.name : ' (source)')));
    if (d.status === 'rejected') {
      const n = interviewsFor(id).length, after = daysBetween(d.applied, d.statusAt);
      body.append(h('div', { class: 'perf' }, '✕ Rejected', d.statusAt ? ' on ' + fmtDate(d.statusAt) : '',
        after != null ? `, ${after} days after applying` : '', n ? ` and ${n} interview${n === 1 ? '' : 's'}` : ', before any interview', '.'));
    }
  }
  if (!isNew && col === 'companies') {
    const ppl = [...companyContacts(id)].map(pid => get('people', pid));
    body.append(h('div', { class: 'perf' }, h('b', null, ppl.length), ` contact${ppl.length === 1 ? '' : 's'} reached here`,
      ppl.some(p => p.kind === 'Referral') ? ', including a referral' : '', ppl.length ? '' : '. Add a contact to light this company up on the map.'));
  }
  if (!isNew && col === 'documents' && d.kind === 'Resume') {
    const used = all('applications').filter(a => a.resumeId === id && a.status !== 'wishlist');
    body.append(h('div', { class: 'perf' }, 'Sent with ', h('b', null, used.length), ' application' + (used.length === 1 ? '' : 's'), ' · ', h('b', null, used.filter(reachedInterview).length), ' reached interview'));
  }
  if (!isNew && col === 'people' && d.email) {
    body.append(h('div', { class: 'row' }, h('span', { class: 'note' }, d.email),
      h('button', { class: 'btn small', type: 'button', onclick: () => navigator.clipboard.writeText(d.email).then(() => toast('Email copied'), () => toast('Copy failed. Select the address instead.')) }, 'Copy email')));
  }

  const form = h('form', { class: 'form', onsubmit: e => { e.preventDefault(); savePanel(); } }, T.fields.map(f => fieldEl(col, f)));
  body.append(form);

  if (!isNew) {
    const key = col + '/' + id;
    const out = refsOf(col, d).filter(x => exists(x.key)).map(x => ({ key: x.key, rel: x.f.label }));
    const inc = allLinks().filter(l => l.target === key).map(l => ({ key: l.source, rel: TYPES[l.source.split('/')[0]].label + ' → ' + l.rel.toLowerCase() }));
    const seen = new Set(); const links = [...out, ...inc].filter(x => !seen.has(x.key) && seen.add(x.key));
    const quick = {
      companies: [['roles', 'Role', { companyId: id }], ['people', 'Contact', { companyId: id }], ['events', 'Event', { refs: [key] }]],
      roles: [['applications', 'Application', { roleId: id }], ['events', 'Event', { refs: [key] }]],
      applications: [['interviews', 'Interview', { applicationId: id }], ['events', 'Event', { refs: [key] }]],
      people: [['events', 'Event', { kind: 'Outreach sent', refs: [key] }]],
      interviews: [['events', 'Event', { refs: [key] }]],
      documents: [], events: [],
    }[col];
    if (quick.length) body.append(h('div', { class: 'row' }, quick.map(([c, l, p]) => h('button', { class: 'btn small', type: 'button', onclick: () => openNew(c, p) }, icon(c), ' + ' + l))));
    body.append(h('div', { class: 'links' }, h('div', { class: 'sec-label' }, 'Connected to'),
      links.length ? links.map(x => { const [c] = x.key.split('/'); const r = getKey(x.key);
        return h('button', { class: 'link-chip', type: 'button', onclick: () => openRecord(x.key) }, icon(c, c === 'applications' ? r.status : null), h('span', { class: 'lt' }, optLabel(c, r)), h('span', { class: 'rel' }, x.rel)); })
        : h('div', { class: 'note' }, 'Nothing linked yet. Use the fields above to connect it.')));
  }

  const foot = h('div', { class: 'p-foot' });
  if (panel.confirmDel) {
    const n = allLinks().filter(l => l.target === col + '/' + id).length;
    foot.append(h('span', { class: 'note' }, n ? `Delete this? ${n} linked item${n === 1 ? '' : 's'} will lose the link.` : 'Delete this for good?'),
      h('span', { class: 'spacer' }),
      h('button', { class: 'btn small', type: 'button', onclick: () => { panel.confirmDel = false; renderPanel(true); } }, 'Keep'),
      h('button', { class: 'btn small danger solid', type: 'button', onclick: () => deleteRecord(col, id) }, 'Delete'));
  } else {
    foot.append(h('button', { id: 'saveBtn', class: 'btn primary', type: 'button', disabled: !panel.dirty, onclick: savePanel }, isNew ? 'Add ' + T.label.toLowerCase() : 'Save changes'));
    if (!isNew && panel.dirty) foot.append(h('button', { class: 'btn', type: 'button', onclick: () => { panel.dirty = false; renderPanel(false); renderPanel(true); } }, 'Discard'));
    foot.append(h('span', { class: 'spacer' }));
    if (!isNew) foot.append(h('button', { class: 'btn small danger', type: 'button', onclick: () => { panel.confirmDel = true; renderPanel(true); } }, 'Delete'));
  }

  el.replaceChildren(
    h('div', { class: 'p-head' }, h('span', { class: 'badge' }, icon(col, col === 'applications' ? d.status : null), T.label),
      h('button', { class: 'x', type: 'button', 'aria-label': 'Close', onclick: closePanel }, '×')),
    body, foot);
  el.hidden = false;
  body.scrollTop = scroll;
}

async function savePanel() {
  if (readOnly) { toast('Changes are not allowed for your account.'); return; }
  const { col, id, draft } = panel, T = TYPES[col];
  for (const f of T.fields) if (f.req && !String(draft[f.k] || '').trim()) {
    toast(`${f.label} is required.`); $(`#f-${col}-${f.k}`)?.focus(); return;
  }
  const prev = panel.mode === 'edit' ? get(col, id) : null;
  const body = stripId(draft);
  for (const k of Object.keys(body)) if (typeof body[k] === 'string') body[k] = body[k].trim();
  body.updatedAt = new Date().toISOString();
  if (!prev) body.createdAt = body.updatedAt;
  if (col === 'applications' && (!prev || prev.status !== body.status)) body.statusAt = localDate();
  const ok = await write(col, id, body); if (!ok) return;
  if (col === 'applications' && !prev && body.status !== 'wishlist') await logEvent('Applied', 'Status change', ['applications/' + id]);
  if (prev && prev.fileId && prev.fileId !== body.fileId && assets) assets.delete(prev.fileId).catch(() => {});
  panel = { mode: 'edit', col, id, dirty: false, draft: structuredClone({ ...body, id }), confirmDel: false };
  state.selected = col + '/' + id;
  toast(prev ? 'Saved' : T.label + ' added');
  renderPanel(true); scheduleRender();
}

/* ---------- Chrome ---------- */
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3200); }
const addBtn = $('#addBtn'), addMenu = $('#addMenu');
addMenu.append(...COLS.map(c => h('button', { type: 'button', onclick: () => openNew(c) }, icon(c, c === 'applications' ? 'applied' : null), TYPES[c].label)));
function closeMenu() { addMenu.hidden = true; addBtn.setAttribute('aria-expanded', 'false'); }
addBtn.onclick = e => { e.stopPropagation(); addMenu.hidden = !addMenu.hidden; addBtn.setAttribute('aria-expanded', String(!addMenu.hidden)); if (!addMenu.hidden) addMenu.querySelector('button').focus(); };
document.addEventListener('click', e => { if (!addMenu.contains(e.target)) closeMenu(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (!addMenu.hidden) closeMenu(); else if (panel.mode && !panel.dirty) closePanel(); } });
$('#clearSample').onclick = clearSample;
let searchT; $('#search').addEventListener('input', e => { clearTimeout(searchT); searchT = setTimeout(() => { state.search = e.target.value; scheduleRender(); }, 120); });
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => setView(b.dataset.view));
function setView(v) {
  state.view = v;
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.view === v)));
  for (const k of ['graph', 'pipeline', 'timeline']) $('#view-' + k).hidden = k !== v;
  try { localStorage.setItem('rr-view', v); } catch (e) {}
  scheduleRender();
}
try { const v = localStorage.getItem('rr-view'); if (['graph', 'pipeline', 'timeline'].includes(v)) setView(v); } catch (e) {}
const KEYS = ['graph', 'pipeline', 'timeline'];
if (KEYS.includes(location.hash.slice(1))) setView(location.hash.slice(1));

centerView();
new ResizeObserver(() => { if (!didFit) centerView(); }).observe(svg.node());
render();
connect();
})();
</script>
